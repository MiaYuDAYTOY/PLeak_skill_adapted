# PLEAK non-Torch dependencies for this machine.
#
# RTX 5060 Laptop GPU reports compute capability sm_120. Install PyTorch
# separately with the official CUDA 12.8 wheels before using this file:
#
#   python -m pip install torch==2.10.0 torchvision==0.25.0 \
#     --index-url https://download.pytorch.org/whl/cu128
#
# Do not install the original paper's PyTorch 2.0.1 / CUDA 11.7 stack on this
# machine; it does not support sm_120.
name: pleak
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.25.0
  - pandas=1.5.3
  - pyarrow=11.0.0
  - scipy=1.11.1
  - scikit-learn=1.3.0
  - matplotlib=3.7.1
  - tqdm
  - pip:
      - accelerate==0.22.0
      - bitsandbytes>=0.49.2
      - datasets==2.13.1
      - evaluate==0.4.0
      - huggingface-hub==0.16.4
      - nltk==3.8.1
      - sentence-transformers==2.2.2
      - sentencepiece==0.1.99
      - setuptools==68.2.2
      - tokenizers==0.13.3
      - torcheval==0.0.6
      - torchmetrics==0.11.4
      - transformers==4.32.1
